spring.application.name=pms
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/pms
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.example.splitease=DEBUG

spring.jpa.properties.hibernate.format_sql=true
securitymaster.api.base-url=http://localhost:8081
securitymaster.api.connect-timeout-ms=3000
securitymaster.api.read-timeout-ms=10000